{% extends "base.html" %}

{% block title %}Novo Pedido - DoceSystem{% endblock %}

{% block content %}
<div class="page-header">
    <div class="breadcrumbs">
        <a href="/pedidos">Pedidos</a>
        <span>/</span>
        <span>Novo Pedido</span>
    </div>
    <h1 class="page-title">Criar Novo Pedido</h1>
    <p class="page-subtitle">Preencha os dados do pedido manual</p>
</div>

<form class="pedido-form" id="novoPedidoForm">
    <div class="form-sections">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Informações do Cliente</h3>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Nome Completo *</label>
                        <input type="text" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Telefone *</label>
                        <input type="tel" class="form-input" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">CPF</label>
                        <input type="text" class="form-input" placeholder="000.000.000-00">
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Detalhes do Pedido</h3>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Tipo de Produto *</label>
                        <select class="form-select" required>
                            <option value="">Selecione...</option>
                            <option>Doces Finos</option>
                            <option>Bem-casados</option>
                            <option>Bolos</option>
                            <option>Salgados</option>
                            <option>Cupcakes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Data do Evento *</label>
                        <input type="date" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Data de Retirada *</label>
                        <input type="date" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Horário de Retirada *</label>
                        <input type="time" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quantidade Total *</label>
                        <input type="number" class="form-input" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tipo de Embalagem</label>
                        <select class="form-select">
                            <option value="">Selecione...</option>
                            <option>Caixa Premium</option>
                            <option>Caixa Simples</option>
                            <option>Saco Plástico</option>
                            <option>Embalagem Personalizada</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">Sabores</label>
                        <textarea class="form-textarea" placeholder="Ex: Brigadeiro, Beijinho, Cajuzinho"></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">Observações</label>
                        <textarea class="form-textarea" placeholder="Informações adicionais sobre o pedido"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Produtos e Valores</h3>
            </div>
            <div class="card-body">
                <div id="produtosContainer">
                    <div class="produto-item">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Produto</label>
                                <input type="text" class="form-input" placeholder="Nome do produto">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Quantidade</label>
                                <input type="number" class="form-input" min="1" value="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Valor Unitário (R$)</label>
                                <input type="number" class="form-input" min="0" step="0.01" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Valor Total (R$)</label>
                                <input type="number" class="form-input valor-total" readonly>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary" onclick="adicionarProduto()">
                    <i class="fas fa-plus"></i>
                    Adicionar Produto
                </button>
            </div>
        </div>
    </div>

    <div class="form-actions-bottom">
        <a href="/pedidos" class="btn btn-secondary">
            <i class="fas fa-times"></i>
            Cancelar
        </a>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i>
            Salvar Pedido
        </button>
    </div>
</form>

<style>
.form-sections {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.produto-item {
    padding: 1rem;
    background: #f8fafc;
    border-radius: 0.5rem;
    margin-bottom: 1rem;
}

.form-actions-bottom {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border-color);
}

@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
function adicionarProduto() {
    const container = document.getElementById('produtosContainer');
    const produtoItem = document.createElement('div');
    produtoItem.className = 'produto-item';
    produtoItem.innerHTML = `
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Produto</label>
                <input type="text" class="form-input" placeholder="Nome do produto">
            </div>
            <div class="form-group">
                <label class="form-label">Quantidade</label>
                <input type="number" class="form-input" min="1" value="1">
            </div>
            <div class="form-group">
                <label class="form-label">Valor Unitário (R$)</label>
                <input type="number" class="form-input" min="0" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label class="form-label">Valor Total (R$)</label>
                <input type="number" class="form-input valor-total" readonly>
            </div>
        </div>
        <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">
            <i class="fas fa-trash"></i>
            Remover
        </button>
    `;
    container.appendChild(produtoItem);
}

document.getElementById('novoPedidoForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Pedido criado com sucesso!');
    window.location.href = '/pedidos';
});

document.addEventListener('input', function(e) {
    if (e.target.type === 'number' && e.target.closest('.produto-item')) {
        const item = e.target.closest('.produto-item');
        const quantidade = item.querySelector('input[type="number"][min="1"]').value || 0;
        const valorUnitario = item.querySelectorAll('input[type="number"]')[1].value || 0;
        const valorTotal = item.querySelector('.valor-total');
        valorTotal.value = (quantidade * valorUnitario).toFixed(2);
    }
});
</script>
{% endblock %}
